name: Check Links

on:
  schedule:
    - cron: '0 0 * * 0'  # 毎週日曜日 00:00 UTC
  workflow_dispatch:  # 手動実行も可能
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: --verbose --no-progress --root-dir . './**/*.html' './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔗 Broken links detected',
              body: 'The scheduled link checker found broken links. Please check the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.',
              labels: ['bug', 'automated']
            })
