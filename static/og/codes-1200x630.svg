<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0b0b0c"/>

  <!-- subtle radial accent in upper-left -->
  <defs>
    <radialGradient id="bg" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2a1d52" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0b0b0c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- lattice motif (scaled-up favicon: 5x5 grid in lower-right corner area) -->
  <g transform="translate(820, 100)" stroke="#c4b5fd" stroke-width="2" opacity="0.35" fill="none">
    <line x1="0" y1="0" x2="320" y2="0"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
    <line x1="0" y1="240" x2="320" y2="240"/>
    <line x1="0" y1="320" x2="320" y2="320"/>
    <line x1="0" y1="0" x2="0" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
  </g>
  <g transform="translate(820, 100)" fill="#c4b5fd">
    <circle cx="0"   cy="0"   r="7"/>
    <circle cx="80"  cy="0"   r="7"/>
    <circle cx="160" cy="0"   r="7"/>
    <circle cx="240" cy="0"   r="7"/>
    <circle cx="320" cy="0"   r="7"/>
    <circle cx="0"   cy="80"  r="7"/>
    <circle cx="80"  cy="80"  r="7"/>
    <circle cx="160" cy="80"  r="7"/>
    <circle cx="240" cy="80"  r="7"/>
    <circle cx="320" cy="80"  r="7"/>
    <circle cx="0"   cy="160" r="7"/>
    <circle cx="80"  cy="160" r="7"/>
    <circle cx="160" cy="160" r="7"/>
    <circle cx="240" cy="160" r="7"/>
    <circle cx="320" cy="160" r="7"/>
    <circle cx="0"   cy="240" r="7"/>
    <circle cx="80"  cy="240" r="7"/>
    <circle cx="160" cy="240" r="7"/>
    <circle cx="240" cy="240" r="7"/>
    <circle cx="320" cy="240" r="7"/>
    <circle cx="0"   cy="320" r="7"/>
    <circle cx="80"  cy="320" r="7"/>
    <circle cx="160" cy="320" r="7"/>
    <circle cx="240" cy="320" r="7"/>
    <circle cx="320" cy="320" r="7"/>
  </g>

  <!-- text block -->
  <text x="80" y="260" fill="#fafafa" font-size="72" font-weight="700" letter-spacing="-1">Sota Shimozono</text>
  <text x="80" y="340" fill="#c4b5fd" font-size="40" font-weight="500">Julia OSS for lattice physics</text>
  <text x="80" y="400" fill="#a1a1aa" font-size="26">LatticeCore · Lattice2D · QuasiCrystal · QAtlas · Reversi</text>

  <!-- footer brand -->
  <line x1="80" y1="530" x2="1120" y2="530" stroke="#27272a" stroke-width="1"/>
  <text x="80" y="575" fill="#a1a1aa" font-size="22">codes.sota-shimozono.com</text>
  <text x="1120" y="575" fill="#a1a1aa" font-size="22" text-anchor="end">@sotashimozono</text>
</svg>
